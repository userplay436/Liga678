
name: Deploy Liga 678 to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TURNAMEN_678 }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting and Database Rules
        run: |
          firebase deploy \
            --only hosting,database \
            --project turnamen-678 \
            --non-interactive
