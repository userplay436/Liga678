<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Liga 678 Online Ready</title>
<style>
:root{--bg:#081321;--panel:#101e30;--panel2:#15263b;--line:#263a52;--txt:#e9f2fc;--muted:#8da5bf;--gold:#f0b84b;--cyan:#42c6d6;--green:#54d39b;--red:#f27c7c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px Inter,system-ui,Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line);background:#0b1726;position:sticky;top:0;z-index:10}
.brand{font-weight:900;font-size:23px;letter-spacing:2px}.brand span{color:var(--gold)}.subtitle{color:var(--muted);font-size:12px}
nav{display:flex;gap:7px;flex-wrap:wrap;padding:12px 20px;background:#0b1726;border-bottom:1px solid var(--line)}
button,.tab{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:9px;padding:9px 12px;font-weight:650}
button:hover,.tab:hover{border-color:var(--cyan)}button.primary{background:var(--gold);border-color:var(--gold);color:#101723}button.danger{border-color:#74434a;color:#ffb0b0}button.small{padding:6px 9px;font-size:12px}
.tab.active{background:var(--gold);color:#101723;border-color:var(--gold)}
main{padding:20px;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.metric{font-size:30px;font-weight:850;margin-top:8px}.label{color:var(--muted);font-size:12px;letter-spacing:1px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 15px}.sectionhead h2{margin:0;font-size:22px}
table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}tbody tr:hover{background:#14253a}
.tablewrap{overflow:auto;border-radius:10px}input,select{background:#0a1727;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px;max-width:100%}input[type=number]{width:65px;text-align:center}input[type=text]{min-width:150px}input[type=date]{color-scheme:dark}
.pill{display:inline-block;border-radius:30px;padding:4px 9px;background:#203850;color:#c9e4ff;font-size:12px}.pill.live{background:#4d252b;color:#ffc3c3}.pill.done{background:#173e35;color:#a8f2ce}
.muted{color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted)}.scoreinputs{display:flex;gap:6px;align-items:center}.scoreinputs input{width:50px}
.matchcard{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.player{font-weight:750}.matchmeta{color:var(--muted);font-size:12px}.sets{font-weight:800;font-size:20px}
canvas{width:100%;height:260px;background:#0b1726;border-radius:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.hidden{display:none!important}
footer{color:var(--muted);text-align:center;padding:20px;font-size:12px}
#tv{position:fixed;inset:0;background:#07111f;z-index:99;display:none;padding:3vw 4vw}#tv.show{display:block}.tvhead{display:flex;justify-content:space-between;align-items:center}.tvtitle{font-size:5vw;font-weight:900;letter-spacing:.08em}.tvtitle span{color:var(--gold)}.tvtable{font-size:2vw;width:100%;min-width:unset}.tvtable th,.tvtable td{padding:1.1vw}.tvtable th{font-size:1.3vw}.tvclose{position:absolute;top:18px;right:22px}
@media(max-width:700px){header{padding:14px}main{padding:12px}nav{padding:10px}.tvtitle{font-size:8vw}.tvtable{font-size:3vw}.tvtable th{font-size:2vw}.card{padding:12px}}
</style>
</head>
<body>
<header><div><div class="brand">LIGA <span>678</span></div><div class="subtitle">TABLE TENNIS LEAGUE · 2026 / 2027</div></div><div class="row"><button onclick="exportData()">Backup</button><button onclick="document.getElementById('importfile').click()">Restore</button><input id="importfile" type="file" class="hidden" accept=".json" onchange="importData(event)"></div></header>
<nav id="nav"></nav><main id="app"></main><div style="max-width:1500px;margin:0 auto;padding:0 20px 20px"><div class="card"><b>Status Firebase:</b> <span id="cloudstatus">Menghubungkan…</span><div class="muted">Publik dapat membaca. Perubahan data hanya untuk admin yang login.</div><div class="row" style="margin-top:12px"><input id="adminemail" type="email" placeholder="Email admin"><input id="adminpass" type="password" placeholder="Password admin"><button class="primary" onclick="firebaseLogin()">Login admin</button><button onclick="firebaseLogout()">Logout</button><span id="authstatus" class="muted">Belum login</span></div></div></div><footer>LIGA 678 · Firebase Realtime Database · Cloud sync</footer>
<div id="tv"><button class="tvclose" onclick="closeTV()">✕ Tutup TV</button><div class="tvhead"><div class="tvtitle">LIGA <span>678</span></div><div id="tvdate"></div></div><div id="tvcontent"></div></div>
<script>
const STORAGE='liga678-v1';
const cats={A:18,B:12};let state;
function rr(ids){let a=ids.slice();if(a.length%2)a.push(null);let out=[];for(let r=0;r<a.length-1;r++){let pairs=[];for(let i=0;i<a.length/2;i++){let x=a[i],y=a[a.length-1-i];if(x&&y)pairs.push([x,y])}out.push(pairs);a=[a[0],a[a.length-1],...a.slice(1,-1)]}return out}
function makeState(){let players=[];for(let c in cats)for(let i=1;i<=cats[c];i++)players.push({id:c+i.toString().padStart(2,'0'),cat:c,name:`Peserta ${c}${i.toString().padStart(2,'0')}`});
let matches=[];for(let c in cats){rr(players.filter(p=>p.cat===c).map(p=>p.id)).forEach((pairs,r)=>pairs.forEach(pair=>matches.push({cat:c,round:r+1,p1:pair[0],p2:pair[1],sets:[],status:'scheduled',id:''})));}
let inter=[];for(let r=1;r<=17;r++){inter.push(...matches.filter(m=>m.cat==='A'&&m.round===r));if(r<=11)inter.push(...matches.filter(m=>m.cat==='B'&&m.round===r))}
let dates=[];for(let d=new Date(2026,11,5);d<=new Date(2027,0,31);d.setDate(d.getDate()+1))if(d.getDay()===0||d.getDay()===6)dates.push(new Date(d));
let index=0;dates.forEach((dt,di)=>{let count=di<3?13:12;for(let k=0;k<count;k++){let m=inter[index];if(!m)continue;let mins=k*240/count,st=new Date(dt);st.setHours(20,Math.floor(mins),0,0);let en=new Date(st.getTime()+240/count*60000);m.date=dt.toISOString().slice(0,10);m.start=st.toTimeString().slice(0,5);m.end=en.toTimeString().slice(0,5);m.id='M'+String(index+1).padStart(3,'0');index++;}});return {players,matches:inter,created:new Date().toISOString()}}
function load(){try{let x=JSON.parse(localStorage.getItem(STORAGE));state=x&&x.players&&x.matches?x:makeState()}catch(e){state=makeState()}save()}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state));if(window.cloudSave)window.cloudSave(state)}
function cloudApply(x){state=x;localStorage.setItem(STORAGE,JSON.stringify(state));render()}
function player(id){return state.players.find(p=>p.id===id)||{name:id}}
function outcome(m){let a=0,b=0;for(let s of m.sets||[]){if(s.a>s.b)a++;else if(s.b>s.a)b++}return a>=3?{winner:m.p1,wa:a,wb:b}:b>=3?{winner:m.p2,wa:a,wb:b}:null}
function standings(cat){let ps=state.players.filter(p=>p.cat===cat);let rows=ps.map(p=>{let played=0,wins=0,loss=0,setsw=0,setsl=0,ptw=0,ptl=0,points=0;for(let m of state.matches.filter(m=>m.cat===cat&&(m.p1===p.id||m.p2===p.id))){let o=outcome(m);if(!o)continue;played++;if(o.winner===p.id){wins++;points+=3}else loss++;for(let s of m.sets){let a=m.p1===p.id?s.a:s.b,b=m.p1===p.id?s.b:s.a;setsw+=a>b?1:0;setsl+=a<b?1:0;ptw+=a;ptl+=b}}return {...p,played,wins,loss,setsw,setsl,setdiff:setsw-setsl,ptw,ptl,ptdiff:ptw-ptl,points,winrate:played?wins/played:0}});
rows.sort((a,b)=>{if(b.points!==a.points)return b.points-a.points;
let tied=rows.filter(x=>x.points===a.points);if(tied.length>1){let hh=(p,q)=>{let m=state.matches.find(m=>m.cat===cat&&((m.p1===p.id&&m.p2===q.id)||(m.p1===q.id&&m.p2===p.id))&&outcome(m));return m?outcome(m).winner===p.id?3:0:0};let hp=hh(a,b),hq=hh(b,a);if(hp!==hq)return hq-hp;}return b.setdiff-a.setdiff||b.ptdiff-a.ptdiff||a.name.localeCompare(b.name)});return rows}
function h(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
let current='dashboard'; window.isAdmin=false; window.saveStatus='';
function nav(){let items=['dashboard','peserta','jadwal','skor','klasemen','statistik','admin'];document.getElementById('nav').innerHTML=items.map(x=>`<button class="tab ${current===x?'active':''}" onclick="page('${x}')">${({dashboard:'Dashboard',peserta:'Peserta',jadwal:'Jadwal',skor:'Input Skor',klasemen:'Klasemen',statistik:'Statistik',admin:'Admin'})[x]}</button>`).join('')+`<button class="tab right" onclick="openTV()">TV / OBS</button>`}
function page(x){current=x;nav();render()}
function render(){let el=document.getElementById('app');if(current==='dashboard')el.innerHTML=dashboard();if(current==='peserta')el.innerHTML=participantPage();if(current==='jadwal')el.innerHTML=schedulePage();if(current==='skor')el.innerHTML=scorePage();if(current==='klasemen')el.innerHTML=standPage();if(current==='statistik')el.innerHTML=statsPage();if(current==='statistik')drawChart();if(current==='admin')adminPage()}
function adminPage(){document.getElementById('app').innerHTML=adminPanel()}
function dashboard(){let finished=state.matches.filter(m=>outcome(m)).length,live=state.matches.filter(m=>m.status==='live').length,next=state.matches.filter(m=>!outcome(m)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,6);return `<div class="sectionhead"><h2>Dashboard Liga</h2><span class="pill">Satu meja · 3 poin kemenangan</span></div><div class="grid"><div class="card"><div class="label">PESERTA KATEGORI A</div><div class="metric">18</div></div><div class="card"><div class="label">PESERTA KATEGORI B</div><div class="metric">12</div></div><div class="card"><div class="label">TOTAL MATCH</div><div class="metric">219</div></div><div class="card"><div class="label">SELESAI</div><div class="metric">${finished}</div><div class="muted">${Math.round(finished/219*100)}% kompetisi</div></div></div><div class="grid"><div class="card"><div class="sectionhead"><h2>Klasemen A</h2><button onclick="page('klasemen')">Detail</button></div>${miniStand('A')}</div><div class="card"><div class="sectionhead"><h2>Klasemen B</h2><button onclick="page('klasemen')">Detail</button></div>${miniStand('B')}</div></div><div class="card"><div class="sectionhead"><h2>Jadwal mendatang</h2><button onclick="page('jadwal')">Semua jadwal</button></div>${next.map(m=>matchLine(m)).join('')||'<div class="empty">Tidak ada jadwal tersisa</div>'}</div>`}
function miniStand(c){let rows=standings(c).slice(0,5);return `<div class="tablewrap"><table><thead><tr><th>#</th><th>Pemain</th><th>M</th><th>Poin</th></tr></thead><tbody>${rows.map((p,i)=>`<tr><td>${i+1}</td><td>${h(p.name)}</td><td>${p.wins}</td><td><b>${p.points}</b></td></tr>`).join('')}</tbody></table></div>`}
function adminPanel(){return `<div class="card"><h2>Panel Admin · Jadwal & Data</h2><p class="muted">Fitur perubahan data hanya aktif setelah login Admin Firebase.</p><div class="row"><button class="primary" onclick="randomDraw()">🎲 Acak ID Peserta (Kategori A & B)</button><button class="danger" onclick="systemReset()">Reset Sistem</button></div><p id="adminhint" class="muted">Pengundian mengganti nomor ID secara acak per kategori, mempertahankan nama dan mengubah referensi pertandingan.</p></div><div class="card"><h3>Pengaturan jumlah peserta</h3><div class="row"><label>A:</label><input id="countA" type="number" min=2 max=100 value="${state.players.filter(p=>p.cat==='A').length}"><label>B:</label><input id="countB" type="number" min=2 max=100 value="${state.players.filter(p=>p.cat==='B').length}"><button onclick="updateCounts()">Terapkan jumlah</button></div><p class="muted">Mengubah jumlah peserta akan membuat ulang jadwal dan menghapus hasil pertandingan. Backup terlebih dahulu.</p></div>`}
function requireAdmin(){if(!window.isAdmin){alert('Silakan login sebagai admin terlebih dahulu.');return false}return true}
function randomDraw(){if(!requireAdmin())return;if(!confirm('Acak ulang nomor ID seluruh peserta? Jadwal/hasil tetap melekat pada pertandingan pemain yang sama.'))return;let map={};for(let c of ['A','B']){let ps=state.players.filter(p=>p.cat===c),nums=ps.map((_,i)=>c+String(i+1).padStart(2,'0'));for(let i=nums.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]]}ps.forEach((p,i)=>map[p.id]=nums[i]);}state.players.forEach(p=>p.id=map[p.id]);state.matches.forEach(m=>{m.p1=map[m.p1]||m.p1;m.p2=map[m.p2]||m.p2});save();render();alert('Pengundian ID selesai dan data disimpan.')}
function systemReset(){if(!requireAdmin())return;if(!confirm('RESET SISTEM? Seluruh nama, skor, jadwal perubahan dan data lokal/cloud akan kembali ke data awal. Backup terlebih dahulu.'))return;let pass=prompt('Untuk memastikan, ketik RESET LIGA 678:');if(pass!=='RESET LIGA 678'){alert('Reset dibatalkan.');return}state=makeState();save();page('dashboard');alert('Sistem direset. Data awal telah disimpan.')}
function updateCounts(){if(!requireAdmin())return;let a=Number(document.getElementById('countA').value),b=Number(document.getElementById('countB').value);if(a<2||b<2||a>100||b>100)return alert('Jumlah peserta harus antara 2 dan 100.');if(!confirm('Perubahan jumlah peserta akan menghapus jadwal dan skor lama. Lanjutkan?'))return;cats.A=a;cats.B=b;state=makeState();save();render();alert('Jumlah peserta dan jadwal baru dibuat.')}
function participantPage(){return `<div class="sectionhead"><h2>Database Peserta</h2><div class="row"><select id="catnew"><option>A</option><option>B</option></select><input id="newname" placeholder="Nama peserta"><button class="primary" onclick="addPlayer()">Tambah</button></div></div><div class="card"><div class="sectionhead"><h2>Kategori A</h2></div>${playerTable('A')}</div><div class="card"><div class="sectionhead"><h2>Kategori B</h2></div>${playerTable('B')}</div>`}
function playerTable(c){return `<div class="tablewrap"><table><thead><tr><th>ID</th><th>Nama</th><th>Action</th></tr></thead><tbody>${state.players.filter(p=>p.cat===c).map(p=>`<tr><td>${p.id}</td><td><input type="text" value="${h(p.name)}" onchange="rename('${p.id}',this.value)"></td><td><button class="small danger" onclick="removePlayer('${p.id}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>`}
function addPlayer(){let c=document.getElementById('catnew').value,n=document.getElementById('newname').value.trim();if(!n)return alert('Masukkan nama peserta.');let cap=cats[c];if(state.players.filter(p=>p.cat===c).length>=cap)return alert('Kategori telah mencapai jumlah peserta default '+cap+'. Jika perlu, silakan hapus peserta terlebih dahulu.');let id=c+String(state.players.filter(p=>p.cat===c).length+1).padStart(2,'0');while(state.players.some(p=>p.id===id))id=c+String(Number(id.slice(1))+1).padStart(2,'0');state.players.push({id,cat:c,name:n});save();render()}
function rename(id,n){let p=player(id);p.name=n.trim()||p.name;save();render()}
function removePlayer(id){if(!confirm('Hapus peserta dan pertandingan yang melibatkan peserta ini?'))return;state.players=state.players.filter(p=>p.id!==id);state.matches=state.matches.filter(m=>m.p1!==id&&m.p2!==id);save();render()}
function matchLine(m){let o=outcome(m);let sets=(m.sets||[]).map(s=>`${s.a}-${s.b}`).join(' · ');return `<div class="card matchcard"><div><div class="matchmeta">${m.id} · Kategori ${m.cat} · Round ${m.round} · ${m.date} ${m.start||''}</div><div class="player">${h(player(m.p1).name)} <span class="muted">vs</span> ${h(player(m.p2).name)}</div><div class="muted">${sets}</div></div><div>${o?`<span class="pill done">Selesai ${o.wa}-${o.wb}</span>`:`<span class="pill">Terjadwal</span>`}</div></div>`}
function schedulePage(){let c=document.getElementById('filtercat')?.value||'all',d=document.getElementById('filterdate')?.value||'',filtered=state.matches.filter(m=>(c==='all'||m.cat===c)&&(!d||m.date===d));return `<div class="sectionhead"><h2>Jadwal Pertandingan</h2><div class="row"><select id="filtercat" onchange="render()"><option value="all">Semua kategori</option><option value="A">Kategori A</option><option value="B">Kategori B</option></select><input id="filterdate" type="date" onchange="render()" value="${d}"><button onclick="clearFilters()">Reset</button></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>ID</th><th>Tanggal</th><th>Jam</th><th>Cat</th><th>Round</th><th>Pemain</th><th>Hasil set</th><th>Status</th></tr></thead><tbody>${filtered.map(m=>`<tr><td>${m.id}</td><td>${m.date}</td><td>${m.start||''}</td><td>${m.cat}</td><td>${m.round}</td><td>${h(player(m.p1).name)} vs ${h(player(m.p2).name)}</td><td>${(m.sets||[]).map(s=>s.a+'-'+s.b).join(' · ')}</td><td>${outcome(m)?'<span class="pill done">Selesai</span>':'<span class="pill">Terjadwal</span>'}</td></tr>`).join('')}</tbody></table></div></div>`}
function clearFilters(){render()}
function scorePage(){let filter=document.getElementById('scorecat')?.value||'all',status=document.getElementById('scorestatus')?.value||'all',list=state.matches.filter(m=>(filter==='all'||m.cat===filter)&&(status==='all'||(status==='done'?!!outcome(m):!outcome(m))));return `<div class="sectionhead"><h2>Input Skor per Set</h2><div class="row"><select id="scorecat" onchange="render()"><option value="all">Semua kategori</option><option value="A">Kategori A</option><option value="B">Kategori B</option></select><select id="scorestatus" onchange="render()"><option value="all">Semua status</option><option value="pending">Belum selesai</option><option value="done">Selesai</option></select></div></div><div class="muted">Isi skor set, lalu klik Simpan. Pemenang adalah pemain pertama yang mencapai 3 set. Gunakan maksimal 5 set.</div>${list.map(m=>scoreCard(m)).join('')}` }
function scoreCard(m){let sets=m.sets||[];return `<div class="card"><div class="sectionhead"><div><b>${m.id}</b> · ${m.cat} · ${m.date} ${m.start||''}<div class="matchmeta">Round ${m.round}</div></div>${outcome(m)?'<span class="pill done">Selesai</span>':'<span class="pill">Belum selesai</span>'}</div><div class="grid"><div><b>${h(player(m.p1).name)}</b><div class="muted">${m.p1}</div></div><div><b>${h(player(m.p2).name)}</b><div class="muted">${m.p2}</div></div></div><div class="row" style="margin-top:12px;align-items:flex-start"><div class="muted">Set:</div>${[0,1,2,3,4].map(i=>`<div class="scoreinputs"><input type="number" min="0" max="99" id="${m.id}_a${i}" value="${sets[i]?.a??''}" placeholder="0"><span>:</span><input type="number" min="0" max="99" id="${m.id}_b${i}" value="${sets[i]?.b??''}" placeholder="0"></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="primary" onclick="saveScore('${m.id}')">Simpan skor</button><button class="danger small" onclick="resetScore('${m.id}')">Reset</button>${outcome(m)?`<span class="pill done">Set ${outcome(m).wa}–${outcome(m).wb}</span>`:''}</div></div>`}
function saveScore(id){let m=state.matches.find(x=>x.id===id);let ss=[];for(let i=0;i<5;i++){let a=document.getElementById(id+'_a'+i).value,b=document.getElementById(id+'_b'+i).value;if(a===''&&b==='')continue;if(a===''||b===''||Number(a)===Number(b))return alert('Skor set harus lengkap dan tidak boleh seri.');let aa=Number(a),bb=Number(b);if(Math.max(aa,bb)<11||Math.abs(aa-bb)<2)return alert('Set harus mencapai minimal 11 poin dan unggul 2 (contoh 11-9 atau 12-10).');ss.push({a:aa,b:bb})}let winsA=ss.filter(s=>s.a>s.b).length,winsB=ss.filter(s=>s.b>s.a).length;if(winsA>3||winsB>3)return alert('Set kemenangan tidak bisa melebihi 3.');if(winsA===3&&winsB>=3||winsB===3&&winsA>=3)return alert('Skor set tidak valid.');if(winsA===3||winsB===3){if(ss.length<3||ss.length>5)return alert('Jumlah set tidak valid.');}else if(ss.length===5)return alert('Set 5 harus menghasilkan pemenang 3 set.');m.sets=ss;m.status=(winsA===3||winsB===3)?'completed':'scheduled';save();render()}
function resetScore(id){let m=state.matches.find(x=>x.id===id);m.sets=[];m.status='scheduled';save();render()}
function standPage(){return `<div class="sectionhead"><h2>Klasemen</h2><div class="row"><button onclick="openTV()">Tampilan TV</button></div></div><div class="card"><h2>Kategori A</h2>${standTable('A')}</div><div class="card"><h2>Kategori B</h2>${standTable('B')}</div><div class="muted">Tie-break otomatis: poin klasemen, selisih set, selisih poin set. Head-to-head belum digunakan sebagai tie-break otomatis.</div>`}
function standTable(c){let rows=standings(c);return `<div class="tablewrap"><table><thead><tr><th>Rank</th><th>Peserta</th><th>Main</th><th>Menang</th><th>Kalah</th><th>Set +</th><th>Set -</th><th>Selisih</th><th>Poin</th></tr></thead><tbody>${rows.map((p,i)=>`<tr><td><b>${i+1}</b></td><td>${h(p.name)}</td><td>${p.played}</td><td>${p.wins}</td><td>${p.loss}</td><td>${p.setsw}</td><td>${p.setsl}</td><td>${p.setdiff>0?'+':''}${p.setdiff}</td><td><b>${p.points}</b></td></tr>`).join('')}</tbody></table></div>`}
function statsPage(){return `<div class="sectionhead"><h2>Statistik Performa</h2><select id="statcat" onchange="render()"><option>A</option><option>B</option></select></div><div class="card"><canvas id="chart" width="900" height="280"></canvas></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Pemain</th><th>Main</th><th>Menang</th><th>Kalah</th><th>Persentase</th><th>Poin</th></tr></thead><tbody>${statRows()}</tbody></table></div></div>`}
function statRows(){let c=document.getElementById('statcat')?.value||'A';return standings(c).map(p=>`<tr><td>${h(p.name)}</td><td>${p.played}</td><td>${p.wins}</td><td>${p.loss}</td><td>${Math.round(p.winrate*100)}%</td><td>${p.points}</td></tr>`).join('')}
function drawChart(){let canvas=document.getElementById('chart');if(!canvas)return;let c=document.getElementById('statcat')?.value||'A',rows=standings(c).slice(0,10),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);let pad=45,bw=(W-pad*2)/Math.max(rows.length,1);ctx.strokeStyle='#263a52';ctx.fillStyle='#8da5bf';ctx.font='14px Arial';ctx.beginPath();ctx.moveTo(pad,15);ctx.lineTo(pad,H-pad);ctx.lineTo(W-10,H-pad);ctx.stroke();rows.forEach((p,i)=>{let bh=(H-pad-40)*p.points/Math.max(3,...rows.map(x=>x.points));let x=pad+i*bw+bw*.15,y=H-pad-bh;ctx.fillStyle='#42c6d6';ctx.fillRect(x,y,bw*.7,bh);ctx.fillStyle='#e9f2fc';ctx.textAlign='center';ctx.fillText(p.points,x+bw*.35,y-7);ctx.save();ctx.translate(x+bw*.35,H-pad+15);ctx.rotate(-.5);ctx.fillText(p.name.substring(0,14),0,0);ctx.restore()})}
function openTV(){let t=document.getElementById('tv');t.classList.add('show');let a=standings('A').slice(0,10),b=standings('B').slice(0,10);document.getElementById('tvdate').innerHTML='<span class="pill">LIVE LEAGUE</span>';document.getElementById('tvcontent').innerHTML=`<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:3vh"><div><h2 style="color:#f0b84b">KATEGORI A</h2>${tvtable(a)}</div><div><h2 style="color:#42c6d6">KATEGORI B</h2>${tvtable(b)}</div></div><div style="margin-top:3vh"><h2>Hasil pertandingan terakhir</h2>${state.matches.filter(m=>outcome(m)).slice(-4).reverse().map(m=>`<div class="card matchcard"><div>${h(player(m.p1).name)} <span class="muted">vs</span> ${h(player(m.p2).name)}</div><div class="sets">${outcome(m).wa} – ${outcome(m).wb}</div><div class="muted">${m.cat} · ${m.date}</div></div>`).join('')}</div>`}
function tvtable(rows){return `<table class="tvtable"><thead><tr><th>#</th><th>Peserta</th><th>W</th><th>Pts</th></tr></thead><tbody>${rows.map((p,i)=>`<tr><td>${i+1}</td><td>${h(p.name)}</td><td>${p.wins}</td><td><b>${p.points}</b></td></tr>`).join('')}</tbody></table>`}
function closeTV(){document.getElementById('tv').classList.remove('show')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Liga678-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.players||!x.matches)throw Error();state=x;save();page(current);alert('Backup berhasil dipulihkan')}catch(err){alert('File backup tidak valid')}};r.readAsText(f)}
load();window.getLigaState=()=>state;window.cloudApply=cloudApply;nav();render();
</script>
